services:
  postgres:
    image: postgres:16-alpine
    container_name: quest-board-postgres
    environment:
        POSTGRES_DB: quest_board
        POSTGRES_USER: quest_user
        POSTGRES_PASSWORD: quest_pass
    networks:
      - quest_net
    ports:
        - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quest_user -d quest_board" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
        - quest-board-postgres-data:/var/lib/postgresql/data

  backend-spring:
    profiles: [ "spring" ]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quest_board
      DB_USER: quest_user
      DB_PASSWORD: quest_pass
    build:
      context: ./questboard-spring/
      dockerfile: ./dockerfiles/Dockerfile${SUFFIX}
    container_name: spring
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quest_net
    ports:
      - "8080:8080"

  backend-quarkus:
    profiles: [ "quarkus" ]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quest_board
      DB_USER: quest_user
      DB_PASSWORD: quest_pass
    build:
      context: ./questboard-quarkus/
      dockerfile: ./dockerfiles/Dockerfile${SUFFIX}
    container_name: quarkus
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quest_net
    ports:
      - "8080:8080"

volumes:
    quest-board-postgres-data:

networks:
  quest_net: